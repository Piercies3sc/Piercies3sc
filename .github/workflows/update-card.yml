name: Profil kartini guncelle

on:
  schedule:
    - cron: "17 3 * * *"      # her gun 03:17 UTC
  workflow_dispatch:           # elle de calistirilabilir
  push:
    paths: ["build_card.py", "ascii_art.json"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Karti olustur
        env:
          # Ozel repolarini de saymak istersen: Settings > Secrets'a GH_PAT ekle
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python build_card.py
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg stats_cache.json
          git diff --cached --quiet || git commit -m "profil karti guncellendi"
          git push
